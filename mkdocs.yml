site_name: Винтаж
site_description: Обучающие материалы для сотрудников

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Roboto
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Вина:
      - Белые:
          - Шабли (Франция): wines/chablis.md
          - Соаве Классико (Италия): wines/soave.md
          - Грюнер Вельтлинер (Австрия): wines/gruner.md
      - Красные:
          - Эгри Бикавер (Венгрия): wines/bikaver.md
          - Риоха Резерва (Испания): wines/rioja.md
          - Мальбек (Аргентина): wines/malbec.md
      - Розовые:
          - Кот-де-Прованс (Франция): wines/provence.md
          - Росадо Наварра (Испания): wines/navarra.md
      - Игристые:
          - Шампань Брют (Франция): wines/champagne.md
          - Просекко (Италия): wines/prosecco.md
  - Меню:
      - Салаты: menu/salads.md
      - Горячие блюда: menu/mains.md
      - Десерты: menu/desserts.md
  - Подача вина:
      - Температура подачи: serving/temperature.md
      - Порядок подачи: serving/order.md
      - Бокалы: serving/glasses.md
      - Декантация: serving/decanting.md
      - Хранение: serving/storage.md
