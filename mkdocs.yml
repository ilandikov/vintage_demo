site_name: Винтаж
site_description: Обучающие материалы для сотрудников

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Roboto
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Вино:
      - Белое:
          - Шабли (Франция): wines/chablis.md
          - Соаве Классико (Италия): wines/soave.md
          - Грюнер Вельтлинер (Австрия): wines/gruner.md
      - Красное:
          - Эгри Бикавер (Венгрия): wines/bikaver.md
          - Риоха Резерва (Испания): wines/rioja.md
          - Мальбек (Аргентина): wines/malbec.md
      - Розовое:
          - Кот-де-Прованс (Франция): wines/provence.md
          - Росадо Наварра (Испания): wines/navarra.md
      - Игристое:
          - Шампань Брют (Франция): wines/champagne.md
          - Просекко (Италия): wines/prosecco.md
  - Пиво:
      - Бельгия:
          - Dubbel: beers/dubbel.md
          - Tripel: beers/tripel.md
          - Witbier: beers/witbier.md
          - Kriek: beers/kriek.md
      - Германия:
          - Pils: beers/pils.md
          - Hefeweizen: beers/hefeweizen.md
          - Rauchbier: beers/rauchbier.md
      - Франция:
          - Bière de Garde: beers/biere_garde.md
          - Blonde d'Alsace: beers/alsace_blonde.md
          - India Pale Ale: beers/french_ipa.md
  - Меню:
      - Салаты: menu/salads.md
      - Горячие блюда: menu/mains.md
      - Десерты: menu/desserts.md
  - Подача вина:
      - Температура подачи: serving/temperature.md
      - Порядок подачи: serving/order.md
      - Бокалы: serving/glasses.md
      - Декантация: serving/decanting.md
      - Хранение: serving/storage.md
