<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="glassChablis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fae6b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c4d79a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7a9c58" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" fill="none"/>

  <!-- bottle body -->
  <path d="M180,50 L220,50 L220,180 Q220,220 260,260 L290,700 Q290,760 230,760 L170,760 Q110,760 110,700 L140,260 Q180,220 180,180 Z"
        fill="url(#glassChablis)" stroke="#4f6b38" stroke-width="2"/>

  <!-- cap / foil -->
  <rect x="175" y="18" width="50" height="42" rx="4" fill="#c9a24b" stroke="#8a6b2e" stroke-width="1.5"/>
  <rect x="175" y="34" width="50" height="6" fill="#8a6b2e"/>

  <!-- label -->
  <rect x="135" y="370" width="130" height="230" rx="3" fill="#f8f4e6" stroke="#9c1722" stroke-width="2"/>
  <rect x="143" y="378" width="114" height="214" rx="2" fill="none" stroke="#c9a24b" stroke-width="1"/>

  <text x="200" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="3" fill="#9c1722">FRANCE</text>
  <line x1="165" y1="428" x2="235" y2="428" stroke="#c9a24b" stroke-width="1"/>

  <text x="200" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3d2b1f">Chablis</text>
  <text x="200" y="495" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="2" fill="#6b5b3a">APPELLATION CHABLIS CONTRÔLÉE</text>

  <line x1="165" y1="512" x2="235" y2="512" stroke="#c9a24b" stroke-width="1"/>
  <text x="200" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#3d2b1f">Domaine des Clos</text>
  <text x="200" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b5b3a">Chardonnay</text>

  <text x="200" y="585" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9c1722">2022</text>

  <!-- lower neck ring -->
  <rect x="176" y="175" width="48" height="6" fill="#c9a24b" opacity="0.7"/>
</svg>
