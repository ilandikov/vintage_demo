<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="glassBikaver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0e18" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6e1a26" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a0b13" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" fill="none"/>

  <!-- bottle body -->
  <path d="M180,50 L220,50 L220,180 Q220,220 260,260 L290,700 Q290,760 230,760 L170,760 Q110,760 110,700 L140,260 Q180,220 180,180 Z"
        fill="url(#glassBikaver)" stroke="#1c0509" stroke-width="2"/>

  <!-- cap / foil -->
  <rect x="175" y="18" width="50" height="42" rx="4" fill="#1a1a1a" stroke="#c9a24b" stroke-width="1.5"/>
  <rect x="175" y="34" width="50" height="6" fill="#c9a24b"/>

  <!-- label -->
  <rect x="135" y="360" width="130" height="240" rx="3" fill="#2b0d12" stroke="#c9a24b" stroke-width="2"/>
  <rect x="143" y="368" width="114" height="224" rx="2" fill="none" stroke="#c9a24b" stroke-width="1"/>

  <text x="200" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#e8c874">MAGYARORSZÁG</text>
  <line x1="165" y1="418" x2="235" y2="418" stroke="#c9a24b" stroke-width="1"/>

  <!-- simple bull-horn emblem -->
  <path d="M185,435 Q170,420 175,405 M215,435 Q230,420 225,405" fill="none" stroke="#c9a24b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="440" r="6" fill="none" stroke="#c9a24b" stroke-width="2"/>

  <text x="200" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8c874">Egri</text>
  <text x="200" y="505" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#e8c874">Bikavér</text>

  <line x1="165" y1="520" x2="235" y2="520" stroke="#c9a24b" stroke-width="1"/>
  <text x="200" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#e8c874">Egri Pincészet</text>
  <text x="200" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#c9a887">Kékfrankos · Kadarka · Cabernet</text>

  <text x="200" y="585" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c9a24b">2020</text>

  <!-- lower neck ring -->
  <rect x="176" y="175" width="48" height="6" fill="#c9a24b" opacity="0.7"/>
</svg>
